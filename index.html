<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Richard Girling, Ph.D. — Candidate for Director of UK Marketing @ Neko Health</title>
    <style>
        :root {
            --neko-bg: #2d4a52; /* Deep teal matching the logo */
            --neko-bg-light: #f4f7f6;
            --text-dark: #1f3137;
            --text-muted: #536b73;
            --accent-blue: #2b6cb0;
            --white: #ffffff;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-dark);
            background-color: var(--white);
            line-height: 1.6;
        }

        header {
            background-color: var(--neko-bg);
            color: var(--white);
            padding: 1.5rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        /* Responsive UI Architecture */
        @media (max-width: 900px) {
            .hero-container {
                flex-direction: column-reverse;
                text-align: center;
                gap: 2rem;
            }
            .matrix-grid { grid-template-columns: 1fr; }
            .case-study-card { grid-template-columns: 1fr; gap: 1.5rem; }
        }
    </style>
</head>
